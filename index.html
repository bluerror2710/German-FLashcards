<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>German Lessons (A1–B2)</title>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>German Lessons</h1>
        <div class="sub">A1 • A2 • B1 • B2 — pick a level, then a lesson. No dates, no stress.</div>
      </div>

      <div class="sectionTitle">Levels</div>
      <div class="navList" id="levelList"></div>

      <div class="sectionTitle" id="lessonSubTitle">Lessons</div>
      <div class="navList" id="lessonList"></div>

      <div class="small" id="errorTop"></div>
    </aside>

    <main class="main">
      <header>
        <div>
          <h2 id="lessonTitle">Loading…</h2>
          <div class="sub" id="lessonMeta">—</div>
        </div>
        <div class="pill">
          <div class="badge" id="count">0 / 0 learned</div>
          <div class="progress"><div class="bar" id="bar"></div></div>
          <button class="btn" id="markAll">Mark all learned</button>
        </div>
      </header>

      <div class="panel">
        <h3>Flashcards (5 words)</h3>
        <div class="note">Tap a card to flip • Learn first, then quiz</div>
        <div class="grid" id="cards"></div>
      </div>

      <div class="panel">
        <h3>Mini‑Quiz</h3>
        <div id="quiz"></div>
        <div class="row">
          <button class="btn" id="check">Check</button>
          <button class="btn" id="reset">Reset</button>
        </div>
      </div>

      <div class="panel">
        <h3>Grammar (5 examples)</h3>
        <div id="grammar"></div>
      </div>
    </main>
  </div>

  <script src="./assets/app.js"></script>
</body>
</html>
